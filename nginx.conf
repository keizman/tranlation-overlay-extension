    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log logs/access.log main;


    server {
        listen 3000;

        # WebSocket 日志接收端点
        location /log-ws {
            content_by_lua_block {
                local server = require "resty.websocket.server"

                -- 独立日志文件路径
                local EXT_LOG_FILE = "/usr/local/openresty/nginx/logs/extension.log"

                -- 写入扩展日志（独立文件）
                local function write_ext_log(msg)
                    local f, err = io.open(EXT_LOG_FILE, "a")
                    if f then
                        f:write(os.date("[%Y-%m-%d %H:%M:%S] ") .. msg .. "\n")
                        f:flush()
                        f:close()
                    else
                        -- 写入失败时输出到 nginx error log
                        ngx.log(ngx.ERR, "[EXT_LOG_FALLBACK] Failed to open file: ", err, " | ", msg)
                    end
                end

                -- 记录连接建立
                write_ext_log("[WS_CONN] Client connected: " .. ngx.var.remote_addr)

                local wb, err = server:new{
                    timeout = 60000,
                    max_payload_len = 65535
                }

                if not wb then
                    write_ext_log("[WS_ERR] Failed to create websocket: " .. (err or "unknown"))
                    return ngx.exit(444)
                end

                while true do
                    local data, typ, err = wb:recv_frame()

                    if not data then
                        if err then
                            write_ext_log("[WS_CLOSE] Connection closed: " .. err)
                        end
                        break
                    end

                    if typ == "close" then
                        write_ext_log("[WS_CLOSE] Client disconnected gracefully")
                        break
                    elseif typ == "ping" then
                        local _, err = wb:send_pong()
                        if err then
                            write_ext_log("[WS_ERR] Failed to send pong: " .. err)
                            break
                        end
                    elseif typ == "text" or typ == "binary" then
                        -- 写入扩展日志（带前缀区分）
                        write_ext_log("[EXT_LOG] " .. data)
                    end
                end
            }
        }
    }